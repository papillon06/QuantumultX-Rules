// ==UserScript==
// @ScriptName        高德地图去广告[zhyio 自定义版]
// @Author            原规则与脚本：@ddgksf2013；自定义维护：@zhyio
// @Source            https://github.com/ddgksf2013/Rewrite/blob/master/AdBlock/AmapAds.conf
// @SourceVersion     V1.0.28（上游标注更新日期：2025-12-06）
// @CustomUpdate      2026-10-21
// @Version           custom-1.0
// @ScriptURL         https://raw.githubusercontent.com/zhyio/QuantumultX-Rules/main/AdBlock/AmapAds.conf
// ==/UserScript==

// 初始只启用 [01]、[12] 两条开屏规则。
// 开启：删除目标规则行最前面的 "# "；停用：在目标规则行最前面加 "# "。
// 请修改以 ^https? 开头的规则行，说明行保留为注释。
// 修改并提交 GitHub 后，在 QuanX 中手动更新此重写资源。
// 请停用原版高德净化订阅，避免原版继续屏蔽其他内容。
// 规则与依赖脚本均保存在本仓库，不自动同步上游。
// 原作者署名、原版备份及来源见 README.md 与 upstream/。

hostname = m5.amap.com, m5-zb.amap.com, center.amap.com, amap-aos-info-nogw.amap.com, ai.amap.com

// [00] 原版广告域名直连辅助项（初始停用；这是分流辅助项，不是广告拦截规则）
// 如需启用，删除下一行前面的 "# "。
# host-suffix, optimus-ads.amap.com, direct

# > [01] 高德地图_开屏请求@ddgksf2013（初始开启）
^https?:\/\/.*\.amap\.com\/ws\/aos\/alimama\/splash_screen url reject-200

# > [02] 高德地图_首页底部信息流@ddgksf2013（初始停用）
 ^https?:\/\/.*\.amap\.com\/v\d\/ai_rec\/ url reject-dict

# > [03] 高德地图_amdc处理@ddgksf2013（初始停用）
 ^http:\/\/amdc\.m\.taobao\.com url script-response-body https://raw.githubusercontent.com/zhyio/QuantumultX-Rules/main/Scripts/amdc.js

# > [04] 高德地图_底部tab栏角标@ddgksf2013（初始停用）
 ^https?:\/\/.*\.amap\.com\/ws\/message\/notice\/list url script-response-body https://raw.githubusercontent.com/zhyio/QuantumultX-Rules/main/Scripts/amap.js

# > [05] 高德地图_路线规划下方广告@ddgksf2013（初始停用）
 ^https?:\/\/.*\.amap\.com\/ws\/faas\/amap-navigation\/card-service-route-plan\? url reject-dict

